<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible"
          content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    {% block styles %}
    {% endblock %}

    <title>
        {% block title %}
        {% endblock %}
    </title>
</head>


<body>
<header class="profile-header">
    <div class="header-logo">

        <a href="{{ url_for('index') }}">
            <img class="header_img" src="{{ url_for('static', filename='img/ikon.png') }}" alt="Логотип">
        </a>

    </div>

    <div class="header-title">
        <b><i>Приложение «Учетник»</i></b>
    </div>

    <nav class="header-nav">
        <a href="{{ url_for('index') }}">Главная страница</a>

        <a href="{{ url_for('task') }}">Задания</a>
    </nav>
    <div class="header-auth">
        <a href="{{ url_for('login') }}" class="btn btn-primary">Войти</a>
        <a href="{{ url_for('register') }}" class="btn btn-white">Зарегистрироваться</a>
    </div>

</header>

<main class="main-content">
{% block body %}
{% endblock %}
</main>

</body>
</html>
